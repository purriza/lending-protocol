[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.22"
optimizer = true
optimizer_runs = 200
no_match_coverage = '(test|mocks|script)'

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[profile.default.fuzz]
runs = 100

[profile.default.invariant]
runs = 100
depth = 15
fail_on_revert = false

# Disable linter during build to suppress lint messages
[lint]
lint_on_build = false
